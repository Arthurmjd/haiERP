spring:
  profiles:
    active: druid          # 激活 druid 配置
  messages:
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 10
          max-idle: 20
          max-active: 30
          max-wait: -1ms
# ---- AI 业务问答（DeepSeek）----
# 系统里只有两处调用大模型：业务问答 /ai/erp/ask 与预警解读 /ai/alerts/explain。
# 不配 OPENAI_API_KEY 时两者都降级为数据摘要，功能仍可用。
# 详细配置见 docs/AI问答接入DeepSeek.md
ai:
  deepseek:
    api-key: ${OPENAI_API_KEY:unset}
    # 官方 https://api.deepseek.com（带不带 /v1 都可用）；换中转站改这里
    base-url: ${OPENAI_BASE_URL:https://api.deepseek.com/v1}
    # deepseek-chat / deepseek-reasoner 已于 2026-07-24 弃用
    # 现役：deepseek-v4-flash（快、便宜）、deepseek-v4-pro（强推理）
    model: ${OPENAI_MODEL:deepseek-v4-flash}
    timeout:
      connect-ms: 5000
      read-ms: 30000

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 200
      min-spare: 20

logging:
  level:
    net.factoryopen.myfactoryai: info
    org.springframework: warn

myfactoryai:
  name: myfactoryai
  version: 1.0.0
  copyrightYear: 2023
  # 文件上传根路径，生产环境用环境变量 PROFILE_DIR 覆盖（勿写 Windows 绝对路径）
  profile: ${PROFILE_DIR:./resource}
  addressEnabled: false
  captchaType: math
  scheduled: false

user:
  password:
    maxRetryCount: 5
    lockTime: 10

token:
  header: Authorization
  secret: ${TOKEN_SECRET}
  expireTime: 30

mybatis:
  typeAliasesPackage: net.factoryopen.**.domain,com.ruoyi.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

swagger:
  # 生产环境通过 SWAGGER_ENABLED=false 关闭 API 文档暴露
  enabled: ${SWAGGER_ENABLED:true}
  # 本机直连后端（8080）时留空；只有在网关/nginx 前面加了统一前缀才填，否则「调试」会拼错地址
  pathMapping: ${SWAGGER_PATH_MAPPING:}

# Swagger UI：http://127.0.0.1:8080/swagger/index.html（页面在 static/swagger/index.html）
# 规范 JSON：http://127.0.0.1:8080/v3/api-docs（分组：/v3/api-docs/{group}）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    # springdoc 自带的 UI 首页在 Boot 3.5 下不会注入 configUrl（会退回 petstore 示例），
    # 且 2.8.9+ 会注册 /swagger-ui/**/*swagger-initializer.js 这个非法模式导致启动失败。
    # 所以关掉官方首页，用 static/swagger/index.html 引同一份 webjar 资源，行为完全可控。
    enabled: false

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*
