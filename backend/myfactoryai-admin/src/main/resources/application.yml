spring:
  profiles:
    active: druid          # 激活 druid 配置
  messages:
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 10
          max-idle: 20
          max-active: 30
          max-wait: -1ms
# ---- AI 业务问答（DeepSeek）----
# 系统里只有两处调用大模型：业务问答 /ai/erp/ask 与预警解读 /ai/alerts/explain。
# 不配 OPENAI_API_KEY 时两者都降级为数据摘要，功能仍可用。
# 详细配置见 docs/AI问答接入DeepSeek.md
ai:
  deepseek:
    api-key: ${OPENAI_API_KEY:unset}
    # 官方 https://api.deepseek.com（带不带 /v1 都可用）；换中转站改这里
    base-url: ${OPENAI_BASE_URL:https://api.deepseek.com/v1}
    # deepseek-chat / deepseek-reasoner 已于 2026-07-24 弃用
    # 现役：deepseek-v4-flash（快、便宜）、deepseek-v4-pro（强推理）
    model: ${OPENAI_MODEL:deepseek-v4-flash}
    timeout:
      connect-ms: 5000
      read-ms: 30000

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 200
      min-spare: 20

logging:
  level:
    net.factoryopen.myfactoryai: info
    org.springframework: warn

myfactoryai:
  name: myfactoryai
  version: 1.0.0
  copyrightYear: 2023
  profile: D:/factoryopen/myfactoryai/resource
  addressEnabled: false
  captchaType: math
  scheduled: false

user:
  password:
    maxRetryCount: 5
    lockTime: 10

token:
  header: Authorization
  secret: ${TOKEN_SECRET}
  expireTime: 30

mybatis:
  typeAliasesPackage: net.factoryopen.**.domain,com.ruoyi.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

swagger:
  enabled: true
  pathMapping: /dev-api

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*
